<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Service | AutoCare</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav>
        <div class="container nav-content">
            <a href="index.html" class="logo">
                <i data-lucide="shield-check"></i>
                AutoCare
            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="booking.html" class="active">Booking</a>
                <a href="store.html">Store</a>
                <a href="history.html">History</a>
                <a href="admin.html">Admin</a>
            </div>
            <div class="nav-actions">
                <button id="theme-toggle" class="btn btn-secondary"></button>
                <button class="btn btn-primary cart-btn" onclick="openModal('cart-modal')">
                    <i data-lucide="shopping-cart"></i>
                    <span class="cart-count">0</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container" style="padding-top: 120px; padding-bottom: 80px;">
        <div class="flex justify-between items-center section-title">
            <h2 style="text-align: left; margin: 0;">Service Bookings</h2>
            <button class="btn btn-primary" onclick="openModal('booking-modal')">
                <i data-lucide="plus"></i>
                New Booking
            </button>
        </div>

        <div id="bookings-list">
            <!-- Bookings will be injected here -->
        </div>
    </main>

    <!-- Booking Modal -->
    <div id="booking-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('booking-modal')">&times;</span>
            <h2 class="mb-4">Book a Service</h2>
            <form id="booking-form" onsubmit="handleBooking(event)">
                <input type="hidden" name="bookingId">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" required placeholder="your name">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" required placeholder="your phone number">
                </div>
                <div class="form-group">
                    <label>Car Model</label>
                    <input type="text" name="carModel" required placeholder="your car model">
                </div>
                <div class="form-group">
                    <label>Service Type</label>
                    <select name="serviceType" required>
                        <option value="Maintenance">Full Maintenance</option>
                        <option value="Diagnostics">System Diagnostics</option>
                        <option value="Brakes">Brake Service</option>
                        <option value="Engine">Engine Tuning</option>
                        <option value="Detailing">Diamond Detailing</option>
                    </select>
                </div>
                <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" name="date" required>
                    </div>
                    <div class="form-group">
                        <label>Preferred Time</label>
                        <input type="time" name="time" required>
                    </div>
                </div>

                <!-- ✅ Correct button -->
                <button type="submit" class="btn btn-primary w-full" style="display: block; width: 100%; text-align: center; margin-top: 10px;">
                    Confirm Booking
                </button>

            </form>
        </div>
    </div>

    <!-- Cart Modal (Shared) -->
    <div id="cart-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('cart-modal')">&times;</span>
            <h2 class="mb-4">Your Cart</h2>
            <div id="cart-items"></div>
            <div class="mt-4 pt-4" style="border-top: 1px solid var(--border)">
                <div class="flex justify-between items-center mb-4">
                    <h3>Total:</h3>
                    <h3 id="cart-total">$0.00</h3>
                </div>
                <button class="btn btn-primary w-full" onclick="checkout()" style="display: block; width: 100%; text-align: center;">Checkout</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        lucide.createIcons();
        window.addEventListener('load', () => {
            renderBookings();
            renderCart();
        });
    </script>
</body>
</html>
