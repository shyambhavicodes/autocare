<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>

    <nav>
        <div class="container nav-content">

            </a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="booking.html">Booking</a>
                <a href="store.html">Store</a>

        </div>

    <main class="container" style="padding-top: 120px; padding-bottom: 80px;">

            <p class="text-secondary">View your past bookings and maintenance records.</p>
        </div>

    
        <div id="bookings-history" class="grid grid-3"></div>
        <div id="orders-list"></div>

    <script src="script.js"></script>

        lucide.createIcons();

            } else {
                console.error("renderHistory not found");

        });
